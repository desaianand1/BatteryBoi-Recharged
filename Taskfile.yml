version: '3'

vars:
  SCHEME: BatteryBoi - Recharged
  PROJECT: BatteryBoi.xcodeproj

tasks:
  setup:
    desc: One-time project setup
    cmds:
      - brew install swiftlint swiftformat pre-commit go-task dopplerhq/cli/doppler
      - bundle install
      - npm install
      - pre-commit install
      - pre-commit install --hook-type commit-msg
      - doppler login
      - doppler setup

  lint:
    desc: Run SwiftLint
    cmds:
      - swiftlint lint BatteryBoi/ "BatteryBoi - RechargedTests/"

  lint:strict:
    desc: Run SwiftLint in strict mode (matches CI)
    cmds:
      - swiftlint lint --strict BatteryBoi/ "BatteryBoi - RechargedTests/"

  lint:fix:
    desc: Run SwiftLint autocorrect
    cmds:
      - swiftlint --fix BatteryBoi/ "BatteryBoi - RechargedTests/"

  format:
    desc: Run SwiftFormat
    cmds:
      - swiftformat BatteryBoi/ "BatteryBoi - RechargedTests/"

  format:check:
    desc: Check SwiftFormat (matches CI)
    cmds:
      - swiftformat --lint BatteryBoi/ "BatteryBoi - RechargedTests/"

  fix:
    desc: Run SwiftFormat & SwiftLint autofix
    cmds:
      - task: format
      - task: lint:fix

  test:
    desc: Run tests
    cmds:
      - bundle exec fastlane test

  build:
    desc: Build with signing (requires Doppler secrets)
    cmds:
      - doppler run -- bundle exec fastlane build

  release:
    desc: Build, sign, notarize, create DMG (requires Doppler secrets)
    cmds:
      - doppler run -- bundle exec fastlane release

  certs:sync:
    desc: Sync certificates from Match (requires Doppler secrets)
    cmds:
      - doppler run -- bundle exec fastlane sync_certs

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf build DerivedData
      - xcodebuild clean -project {{.PROJECT}} -scheme '{{.SCHEME}}' || true

  check:
    desc: Run all checks (format + lint strict, matches CI)
    cmds:
      - task: format:check
      - task: lint:strict


  dev:
    desc: Build and run in debug mode (ad-hoc signing, no secrets required)
    cmds:
      - pkill -f "BatteryBoi - Recharged" || true
      - xcodebuild -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration Debug -derivedDataPath DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG DIRECT_DISTRIBUTION" build
      - |
        APP=$(find DerivedData/Build/Products/Debug -name "*.app" -maxdepth 1 | head -1)
        open "$APP"

  appstore:
    desc: Build and submit to Mac App Store (requires Doppler prd secrets)
    cmds:
      - doppler run --config prd -- bundle exec fastlane appstore_submit

  testflight:
    desc: Build and upload to TestFlight (requires Doppler prd secrets)
    cmds:
      - doppler run --config prd -- bundle exec fastlane testflight_upload

  certs:sync:appstore:
    desc: Sync App Store Match certificates (requires Doppler prd secrets)
    cmds:
      - doppler run --config prd -- bundle exec fastlane sync_certs type:appstore

  setup:appstore:
    desc: One-time App Store Connect app creation (requires Doppler prd secrets)
    cmds:
      - doppler run --config prd -- bundle exec fastlane setup_appstore

  ci:
    desc: Run full CI pipeline locally (lint strict + format + test, no secrets required)
    cmds:
      - task: lint:strict
      - task: format:check
      - task: test
