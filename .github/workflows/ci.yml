name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.2'
  NODE_VERSION: '24'
  SWIFTLINT_VERSION: '0.65.1'
  SWIFTFORMAT_VERSION: '0.62.1'
  SCHEME: 'BatteryBoi - Recharged'
  PROJECT: 'BatteryBoi.xcodeproj'

jobs:
  validate-commits:
    name: Validate Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  swift-lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: |
          brew install swiftlint
          echo "SwiftLint version: $(swiftlint version) (expected: $SWIFTLINT_VERSION)"

      - name: Run SwiftLint
        run: swiftlint lint --strict BatteryBoi/

  swift-format-check:
    name: SwiftFormat Check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SwiftFormat
        run: |
          brew install swiftformat
          echo "SwiftFormat version: $(swiftformat --version) (expected: $SWIFTFORMAT_VERSION)"

      - name: Check formatting
        run: swiftformat --lint BatteryBoi/

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Tests
        run: bundle exec fastlane test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_output
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: macos-15
    needs: [swift-lint, swift-format-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Fetch Doppler Secrets
        uses: dopplerhq/secrets-fetch-action@v1.3.0
        with:
          doppler-token: ${{ secrets.DOPPLER_CI_TOKEN }}
          doppler-project: batteryboi-recharged
          doppler-config: ci
          inject-env-vars: true

      - name: Build
        run: bundle exec fastlane build

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [swift-lint, swift-format-check, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        run: npx semantic-release

  create-sentry-release-staging:
    name: Create Sentry Release (Staging)
    runs-on: ubuntu-latest
    needs: [semantic-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch Doppler Secrets
        uses: dopplerhq/secrets-fetch-action@v1.3.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_CI_TOKEN }}
          doppler-project: batteryboi-recharged
          doppler-config: ci
          inject-env-vars: true

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ steps.doppler.outputs.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ steps.doppler.outputs.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ steps.doppler.outputs.SENTRY_PROJECT }}
        with:
          environment: staging
          finalize: true
          ignore_missing: true
